# /etc/nginx/sites-available/notams
#
# Cambios respecto a la configuracion original:
#   * Compresion gzip (index.html pesa ~530 KB y se enviaba sin comprimir).
#   * Cabeceras de seguridad basicas.
#   * X-Forwarded-For / X-Forwarded-Proto, que faltaban: sin ellas la API
#     registra todas las peticiones como provenientes de 127.0.0.1.
#   * Timeouts explicitos y limite de tamano de peticion.
#   * /health accesible sin registrar ruido en el log de acceso.
#
# Para HTTPS: instalar certbot y ejecutar
#   sudo certbot --nginx -d tu-dominio.com

upstream notams_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 2m;

    # --- Compresion ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # --- Cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/notams-access.log;
    error_log  /var/log/nginx/notams-error.log warn;

    location /health {
        access_log off;
        proxy_pass http://notams_api;
        proxy_set_header Host $host;
    }

    # Video de fondo y poster. Ya vienen comprimidos, asi que gzip aqui solo
    # gastaria CPU. El Cache-Control largo lo pone la propia API.
    location /static/ {
        gzip off;
        access_log off;
        proxy_pass http://notams_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # El navegador pide el video por rangos; sin reenviar estas cabeceras
        # no puede reanudar una descarga cortada.
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location / {
        proxy_pass http://notams_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
